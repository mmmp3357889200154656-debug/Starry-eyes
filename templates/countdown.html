<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🌟 ستاره‌ی من 🌟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: black;
            font-family: 'Vazir', 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        #countdown {
            color: #0b3d91;
            font-size: 300px;
            font-weight: bold;
            text-shadow: 0 0 80px rgba(11, 61, 145, 0.8), 0 0 150px rgba(11, 61, 145, 0.4);
            animation: pulse 0.5s ease-in-out infinite alternate;
            z-index: 10;
            font-family: 'Arial Black', 'Segoe UI', sans-serif;
            position: absolute;
            transition: all 0.3s ease;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; text-shadow: 0 0 80px rgba(11, 61, 145, 0.8); }
            100% { transform: scale(1.15); opacity: 1; text-shadow: 0 0 150px rgba(11, 61, 145, 1), 0 0 250px rgba(11, 61, 145, 0.6); }
        }

        #blue-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #7ab8e6;
            z-index: 1;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
        #blue-screen.visible {
            opacity: 1;
        }

        /* صفحه پایانی سبز با ستاره‌ها */
        #final-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #b5d3a8;
            z-index: 20;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            transform: scale(0.3);
            transition: all 1.5s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        #final-screen.visible {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }
        #final-screen h1 {
            font-size: 60px;
            color: #2d5a27;
            text-shadow: 0 0 30px rgba(45, 90, 39, 0.3);
            font-family: 'Vazir', 'Segoe UI', Tahoma, sans-serif;
            text-align: center;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }
        #final-screen .final-star-icon {
            font-size: 80px;
            color: #2d5a27;
            animation: twinkle 1.5s ease-in-out infinite alternate;
        }
        #final-screen .final-star-icon.delay {
            animation-delay: 0.5s;
        }
        @keyframes twinkle {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.3); opacity: 1; }
        }

        .rays-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            opacity: 0;
            transition: opacity 1s ease;
            width: 400px;
            height: 400px;
            pointer-events: none;
        }
        .rays-container.visible {
            opacity: 1;
        }

        .ray {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center;
            width: 2px;
            height: 80px;
            background: rgba(122, 184, 230, 0.3);
            border-radius: 2px;
            animation: raySpin 10s linear infinite;
            filter: blur(3px);
        }
        .ray:nth-child(1) { transform: translate(-50%, -100%) rotate(0deg); animation-delay: 0s; }
        .ray:nth-child(2) { transform: translate(-50%, -100%) rotate(15deg); animation-delay: 0.4s; }
        .ray:nth-child(3) { transform: translate(-50%, -100%) rotate(30deg); animation-delay: 0.8s; }
        .ray:nth-child(4) { transform: translate(-50%, -100%) rotate(45deg); animation-delay: 1.2s; }
        .ray:nth-child(5) { transform: translate(-50%, -100%) rotate(60deg); animation-delay: 1.6s; }
        .ray:nth-child(6) { transform: translate(-50%, -100%) rotate(75deg); animation-delay: 2.0s; }
        .ray:nth-child(7) { transform: translate(-50%, -100%) rotate(90deg); animation-delay: 2.4s; }
        .ray:nth-child(8) { transform: translate(-50%, -100%) rotate(105deg); animation-delay: 2.8s; }
        .ray:nth-child(9) { transform: translate(-50%, -100%) rotate(120deg); animation-delay: 3.2s; }
        .ray:nth-child(10) { transform: translate(-50%, -100%) rotate(135deg); animation-delay: 3.6s; }
        .ray:nth-child(11) { transform: translate(-50%, -100%) rotate(150deg); animation-delay: 4.0s; }
        .ray:nth-child(12) { transform: translate(-50%, -100%) rotate(165deg); animation-delay: 4.4s; }
        .ray:nth-child(13) { transform: translate(-50%, -100%) rotate(180deg); animation-delay: 4.8s; }
        .ray:nth-child(14) { transform: translate(-50%, -100%) rotate(195deg); animation-delay: 5.2s; }
        .ray:nth-child(15) { transform: translate(-50%, -100%) rotate(210deg); animation-delay: 5.6s; }
        .ray:nth-child(16) { transform: translate(-50%, -100%) rotate(225deg); animation-delay: 6.0s; }
        .ray:nth-child(17) { transform: translate(-50%, -100%) rotate(240deg); animation-delay: 6.4s; }
        .ray:nth-child(18) { transform: translate(-50%, -100%) rotate(255deg); animation-delay: 6.8s; }
        .ray:nth-child(19) { transform: translate(-50%, -100%) rotate(270deg); animation-delay: 7.2s; }
        .ray:nth-child(20) { transform: translate(-50%, -100%) rotate(285deg); animation-delay: 7.6s; }
        .ray:nth-child(21) { transform: translate(-50%, -100%) rotate(300deg); animation-delay: 8.0s; }
        .ray:nth-child(22) { transform: translate(-50%, -100%) rotate(315deg); animation-delay: 8.4s; }
        .ray:nth-child(23) { transform: translate(-50%, -100%) rotate(330deg); animation-delay: 8.8s; }
        .ray:nth-child(23) { transform: translate(-50%, -100%) rotate(330deg); animation-delay: 9.0s; }
        .ray:nth-child(24) { transform: translate(-50%, -100%) rotate(345deg); animation-delay: 9.2s; }

        @keyframes raySpin {
            0% { opacity: 0.2; transform: translate(-50%, -100%) scale(0.7); }
            50% { opacity: 0.8; transform: translate(-50%, -100%) scale(1.3); }
            100% { opacity: 0.2; transform: translate(-50%, -100%) scale(0.7); }
        }

        .star-glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 2;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(122, 184, 230, 0.25) 0%, transparent 70%);
            transition: all 1.5s cubic-bezier(0.34, 1.2, 0.64, 1);
            opacity: 0;
            pointer-events: none;
        }
        .star-glow-ring.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(3);
        }

        .star-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 3;
            opacity: 0;
            transition: all 1.5s cubic-bezier(0.34, 1.2, 0.64, 1);
            pointer-events: none;
        }
        .star-container svg {
            width: 280px;
            height: 280px;
            transition: all 1.5s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        .star-container svg .star-fill {
            fill: #7ab8e6;
            stroke: #7ab8e6;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: url(#glow);
            transition: all 1.5s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        .star-container.stage1 {
            opacity: 0.3;
            transform: translate(-50%, -50%) scale(0.05);
        }
        .star-container.stage1 svg .star-fill {
            fill: rgba(122, 184, 230, 0.2);
            stroke: rgba(122, 184, 230, 0.2);
            stroke-width: 2;
        }

        .star-container.stage2 {
            opacity: 0.7;
            transform: translate(-50%, -50%) scale(0.5);
        }
        .star-container.stage2 svg .star-fill {
            fill: rgba(122, 184, 230, 0.5);
            stroke: rgba(122, 184, 230, 0.5);
            stroke-width: 3;
        }

        .star-container.stage3 {
            opacity: 1;
            transform: translate(-50%, -50%) scale(8);
        }
        .star-container.stage3 svg .star-fill {
            fill: #7ab8e6;
            stroke: #7ab8e6;
            stroke-width: 6;
            filter: url(#glow-strong);
        }

        .message {
            position: absolute;
            font-weight: bold;
            pointer-events: none;
            white-space: nowrap;
            z-index: 10;
            opacity: 0;
            animation: messageMessy 9s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        @keyframes messageMessy {
            0% { 
                opacity: 0; 
                transform: translateY(100px) scale(0.2) rotate(-20deg); 
            }
            12% { 
                opacity: 1; 
                transform: translateY(0) scale(1.3) rotate(5deg); 
            }
            35% { 
                opacity: 1; 
                transform: translateY(-20px) scale(1) rotate(0deg); 
            }
            65% { 
                opacity: 1; 
                transform: translateY(20px) scale(1.1) rotate(-5deg); 
            }
            85% { 
                opacity: 0.5; 
                transform: translateY(50px) scale(0.8) rotate(10deg); 
            }
            100% { 
                opacity: 0; 
                transform: translateY(120px) scale(0.1) rotate(25deg); 
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

            "Ya tebya liubliu", "S'agapo", "Unë të dua", "Te dua",
            "Dua të", "Të dua", "Mam ty", "I adore you", "Je t'adore",
            "Ich bete dich an", "Ti adoro", "Te adoro",
            "あなたを崇拝しています", "Ya obozhayu tebya",
            "STAY", "FELT LIKE HOME"
        ];

        const stars = [];
        for (let i = 0; i < 80; i++) {
            stars.push("✦");
        }

        let messages = [...baseMessages, ...stars];
        
        for (let i = messages.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [messages[i], messages[j]] = [messages[j], messages[i]];
        }

        const pastelColors = [
            '#f8a4b8', '#a8d8ea', '#d4a5d4', '#b5d3a8', '#f7d794',
            '#f5b7b7', '#aec6cf', '#d7bde2', '#a9dfbf', '#fadbd8',
            '#f9e79f', '#f5cba7', '#d5f5e3', '#e8daef', '#aed6f1',
            '#f1948a', '#85c1e9', '#bb8fce', '#82e0aa', '#f8c471',
            '#fbc4c4', '#c4e0f5', '#e8c4f5', '#c4f5d4', '#f5e8c4',
            '#f5c4d4', '#c4d4f5', '#d4c4f5', '#c4f5e8', '#f5d4c4'
        ];

        let countdown = 5;
        let messageIndex = 0;
        let allMessagesShown = false;
        const countdownEl = document.getElementById('countdown');
        const blueScreen = document.getElementById('blue-screen');
        const starContainer = document.getElementById('starContainer');
        const raysContainer = document.getElementById('raysContainer');
        const starGlowRing = document.getElementById('starGlowRing');
        const finalScreen = document.getElementById('final-screen');
        let addInterval;
        let removeInterval;
        const TARGET_MESSAGES = 50;

        function startCountdown() {
            const timer = setInterval(() => {
                countdown--;

                if (countdown === 3) {
                    starContainer.style.opacity = '1';
                    starContainer.className = 'star-container stage1';
                    raysContainer.classList.add('visible');
                } else if (countdown === 2) {
                    starContainer.className = 'star-container stage2';
                } else if (countdown === 1) {
                    starContainer.className = 'star-container stage3';
                    starGlowRing.classList.add('visible');

                    setTimeout(() => {
                        blueScreen.style.display = 'block';
                        setTimeout(() => {
                            blueScreen.classList.add('visible');
                        }, 100);
                    }, 500);
                }

                if (countdown > 0) {
                    countdownEl.textContent = countdown;
                } else {
                    clearInterval(timer);
                    countdownEl.classList.add('hidden');

                    setTimeout(() => {
                        fillInitialMessages();
                        startRandomMessyMessages();
                    }, 1200);
                }
            }, 1000);
        }

        function fillInitialMessages() {
            const count = Math.min(TARGET_MESSAGES, messages.length);
            for (let i = 0; i < count; i++) {
                createMessage();
            }
        }

        function startRandomMessyMessages() {
            addInterval = setInterval(() => {
                if (messageIndex >= messages.length && !allMessagesShown) {
                    allMessagesShown = true;
                    clearInterval(addInterval);
                    clearInterval(removeInterval);
                    setTimeout(() => {
                        document.querySelectorAll('.message').forEach(el => {
                            el.style.transition = 'all 0.8s ease';
                            el.style.opacity = '0';
                            el.style.transform = 'scale(0.2)';
                            setTimeout(() => el.remove(), 800);
                        });
                        setTimeout(() => {
                            showFinalScreen();
                        }, 1000);
                    }, 1500);
                    return;
                }

                if (messageIndex < messages.length) {
                    const count = Math.floor(Math.random() * 4) + 1;
                    for (let i = 0; i < count && messageIndex < messages.length; i++) {
                        createMessage();
                    }
                }
            }, 300 + Math.random() * 700);

            removeInterval = setInterval(() => {
                const currentMessages = document.querySelectorAll('.message');
                if (currentMessages.length > TARGET_MESSAGES + 10) {
                    const toRemove = Math.floor(Math.random() * 3) + 1;
                    for (let i = 0; i < toRemove && i < currentMessages.length; i++) {
                        if (currentMessages[i]) {
                            currentMessages[i].style.transition = 'all 0.6s ease';
                            currentMessages[i].style.opacity = '0';
                            currentMessages[i].style.transform = 'scale(0.1) rotate(30deg)';
                            setTimeout(() => {
                                if (currentMessages[i] && currentMessages[i].parentNode) {
                                    currentMessages[i].remove();
                                }
                            }, 600);
                        }
                    }
                }
            }, 500 + Math.random() * 800);
        }

        function createMessage() {
            if (messageIndex >= messages.length) return;
            
            const message = messages[messageIndex];
            messageIndex++;
            const color = pastelColors[Math.floor(Math.random() * pastelColors.length)];

            const msgEl = document.createElement('div');
            msgEl.className = 'message';
            msgEl.textContent = message;
            msgEl.style.color = color;
            msgEl.style.fontSize = (14 + Math.random() * 40) + 'px';
            msgEl.style.left = (Math.random() * 96 + 2) + '%';
            msgEl.style.top = (Math.random() * 96 + 2) + '%';

            const duration = 4 + Math.random() * 8;
            const delay = Math.random() * 2;
            msgEl.style.animationDuration = duration + 's';
            msgEl.style.animationDelay = delay + 's';
            msgEl.style.textShadow = `0 0 25px ${color}70, 0 0 50px ${color}30`;
            msgEl.style.fontWeight = 'bold';

            const fonts = ['Vazir', 'Tahoma', 'Arial', 'Segoe UI', 'Comic Sans MS', 'Georgia', 'Times New Roman'];
            msgEl.style.fontFamily = fonts[Math.floor(Math.random() * fonts.length)];

            document.body.appendChild(msgEl);

            const removeDelay = (duration + delay) * 1000 + 500 + Math.random() * 1000;
            setTimeout(() => {
                if (msgEl.parentNode) {
                    msgEl.style.transition = 'all 0.6s ease';
                    msgEl.style.opacity = '0';
                    msgEl.style.transform = 'scale(0.1) rotate(30deg)';
                    setTimeout(() => {
                        if (msgEl.parentNode) {
                            msgEl.remove();
                        }
                    }, 600);
                }
            }, removeDelay);
        }

        function showFinalScreen() {
            finalScreen.classList.add('visible');
        }

        startCountdown();
    </script>
